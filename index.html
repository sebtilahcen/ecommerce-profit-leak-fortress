<!-- نموذج الربط المباشر للمتجر -->
<div class="bg-[var(--bg-card)] border border-slate-800 p-6 rounded-3xl space-y-4">
    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wide">
        <i class="fa-solid fa-link"></i> ربط متجري الحقيقي (Live API Sync)
    </h3>
    <div class="space-y-3">
        <input type="text" id="store-domain" placeholder="your-store.myshopify.com" class="w-full p-3 bg-[var(--bg-input)] border border-slate-700 rounded-xl text-sm text-white">
        <input type="password" id="api-token" placeholder="أدخل مفتاح التوثيق (Access Token)" class="w-full p-3 bg-[var(--bg-input)] border border-slate-700 rounded-xl text-sm text-white">
        <button type="button" onclick="connectLiveStore()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition text-sm cursor-pointer">
            سحب البيانات الحقيقية للمتجر
        </button>
    </div>
</div>

<script>
async function connectLiveStore() {
    const domain = document.getElementById('store-domain').value;
    const token = document.getElementById('api-token').value;

    try {
        const res = await fetch('/api/sync-shopify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ shopDomain: domain, accessToken: token })
        });
        const result = await res.json();
        if(result.success) {
            alert('تم سحب بيانات المتجر بنجاح وتحديث لوحة التحليل!');
            // هنا يمكنك تحديث حقول الـ Sliders تلقائياً بالبيانات القادمة من المتجر
        } else {
            alert('فشل الاتصال: تأكد من صحة البيانات المدخلة.');
        }
    } catch (err) {
        console.error(err);
    }
}
</script>
